name: SDK verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      evidence:
        description: Upload fixture-only review evidence (no live Herdr or recording)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Full verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Development tools have stricter engines than the package's Node >=20 runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Read package manager version from package source
        id: package-manager
        shell: bash
        run: node -e 'const p=require("./package.json"); if(p.devEngines.packageManager.name!=="pnpm") process.exit(1); console.log("version="+p.devEngines.packageManager.version)' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.package-manager.outputs.version }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Full verification
        shell: bash
        run: pnpm run verify 2>&1 | tee "$RUNNER_TEMP/sdk-verification.log"
      # Upload is explicitly requested through workflow_dispatch, never on ordinary PR/push runs.
      - name: Collect requested fixture evidence
        if: github.event_name == 'workflow_dispatch' && inputs.evidence && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-review-evidence"
          cp "$RUNNER_TEMP/sdk-verification.log" "$RUNNER_TEMP/sdk-review-evidence/verification.log"
          for recipe in scoped-subscription graphics-writer request-wire-result; do
            node scripts/sdk-evidence.mjs run "$recipe" --out "$RUNNER_TEMP/sdk-review-evidence" --json > "$RUNNER_TEMP/sdk-review-evidence/$recipe.json"
          done
      - name: Upload requested fixture evidence
        if: github.event_name == 'workflow_dispatch' && inputs.evidence && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-review-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-review-evidence
          if-no-files-found: error
          retention-days: 30

  package-platform:
    name: Packed Node ${{ matrix.runtime }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: ["20.0.0", "22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime }}
      - name: Retain package runtime executable
        id: runtime
        shell: bash
        run: node -e 'console.log("node="+process.execPath)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Read package manager version from package source
        id: package-manager
        shell: bash
        run: node -e 'const p=require("./package.json"); if(p.devEngines.packageManager.name!=="pnpm") process.exit(1); console.log("version="+p.devEngines.packageManager.version)' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.package-manager.outputs.version }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      # Focused Windows coverage is intentional; this does not claim full Windows suite portability.
      - run: pnpm run test:platform
      - name: Check tarball imports under package runtime and declarations under development TypeScript
        shell: bash
        env:
          PACKAGE_RUNTIME_NODE: ${{ steps.runtime.outputs.node }}
        run: pnpm run check:package --runtime-node "$PACKAGE_RUNTIME_NODE"
